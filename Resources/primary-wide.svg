        <text x="120" y="80" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="4">
            KHYLO
        </text>
        <text x="122" y="104" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif" font-size="14" font-weight="700" fill="#D97732" letter-spacing="6">
            MOBILE CLIENT
        </text>
    </g>
