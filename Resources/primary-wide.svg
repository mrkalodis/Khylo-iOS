<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000px" height="200px" viewBox="0 0 1000 200" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Khylo iOS Banner</title>
    <defs>
        <linearGradient x1="0%" y1="0%" x2="100%" y2="100%" id="khyloAmber">
            <stop stop-color="#FF9345" offset="0%"/>
            <stop stop-color="#D97732" offset="50%"/>
            <stop stop-color="#A54F10" offset="100%"/>
        </linearGradient>
    </defs>
    <rect fill="#08090A" x="0" y="0" width="1000" height="200" rx="24"/>
    <g transform="translate(360, 40)">
