name: "Build 🔨"

on:
  push:
    branches: [ main ]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches: [ main ]

jobs:
  build:
    name: "Build 🔨"
    if: github.event.pull_request.draft == false
    permissions:
      contents: write
    strategy:
      matrix:
        scheme:
          - "Swiftfin"
          - "Swiftfin tvOS"

    runs-on: macos-14

    env:
      XCODE_VERSION: "26.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Homebrew dependencies
        run: brew bundle --file Brewfile

      - name: Restore Swift packages
        id: swift-packages
        uses: actions/cache/restore@v6
        with:
          path: |
            build/SourcePackages/checkouts
            build/SourcePackages/repositories
            build/SourcePackages/artifacts
            build/SourcePackages/workspace-state.json
          key: spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_VERSION }}-${{ matrix.scheme }}-${{ hashFiles('Swiftfin.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_VERSION }}-${{ matrix.scheme }}-

      - name: Build
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 60
          command: bundle exec fastlane buildLane scheme:"\"${{ matrix.scheme }}\""

      - name: Package unsigned IPA
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          set -euo pipefail
          mkdir -p fastlane/build/Payload
          cp -R fastlane/build/*.xcarchive/Products/Applications/*.app fastlane/build/Payload/
          cd fastlane/build
          zip -r -y "$SCHEME-unsigned.ipa" Payload
          if [ "$SCHEME" = "Swiftfin" ]; then
            cp "$SCHEME-unsigned.ipa" "Khylo-iOS.ipa"
          else
            cp "$SCHEME-unsigned.ipa" "Khylo-tvOS.ipa"
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scheme }}-unsigned
          path: fastlane/build/*.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' && matrix.scheme == 'Swiftfin'
        with:
          tag_name: "v26.10.010"
          name: "Khylo iOS DEV-V26.10.010"
          body: |
            ### Khylo iOS DEV-V26.10.010
            
            Official native iOS build of the Khylo client.
            
            - **Download:** `Khylo-iOS.ipa`
          files: |
            fastlane/build/Khylo-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Populate the shared cache from main,
      # PR caches are isolated to their merge ref
      - name: Save Swift packages
        if: ${{ github.event_name == 'push' && steps.swift-packages.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            build/SourcePackages/checkouts
            build/SourcePackages/repositories
            build/SourcePackages/artifacts
            build/SourcePackages/workspace-state.json
          key: ${{ steps.swift-packages.outputs.cache-primary-key }}