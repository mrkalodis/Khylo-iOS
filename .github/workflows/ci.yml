name: "Build Khylo iOS 📱"

on:
  push:
    branches: [ main ]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches: [ main ]

jobs:
  build:
    name: "Build Khylo iOS 📱"
    if: github.event.pull_request.draft == false
    permissions:
      contents: write

    runs-on: macos-26

    env:
      XCODE_VERSION: "26.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Homebrew dependencies
        run: brew bundle --file Brewfile

      - name: Restore Swift packages
        id: swift-packages
        uses: actions/cache/restore@v6
        with:
          path: |
            build/SourcePackages/checkouts
            build/SourcePackages/repositories
            build/SourcePackages/artifacts
            build/SourcePackages/workspace-state.json
          key: spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_VERSION }}-ios-${{ hashFiles('Swiftfin.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_VERSION }}-ios-

      - name: Build
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 60
          command: bundle exec fastlane buildLane \
            scheme:"\"Swiftfin\"" \
            xcodeVersion:${{ env.XCODE_VERSION }}

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p fastlane/build/Payload
          cp -R fastlane/build/*.xcarchive/Products/Applications/*.app fastlane/build/Payload/
          cd fastlane/build
          zip -r -y "Khylo-iOS.ipa" Payload

      - name: Upload Khylo iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Khylo-iOS-unsigned
          path: fastlane/build/Khylo-iOS.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v26.10.010"
          name: "Khylo iOS DEV-V26.10.010"
          body: |
            ### Khylo iOS DEV-V26.10.010

            Official native iOS build of the Khylo client.

            - **Download:** `Khylo-iOS.ipa`
          files: |
            fastlane/build/Khylo-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Populate the shared cache from main,
      # PR caches are isolated to their merge ref
      - name: Save Swift packages
        if: ${{ github.event_name == 'push' && steps.swift-packages.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            build/SourcePackages/checkouts
            build/SourcePackages/repositories
            build/SourcePackages/artifacts
            build/SourcePackages/workspace-state.json
          key: ${{ steps.swift-packages.outputs.cache-primary-key }}